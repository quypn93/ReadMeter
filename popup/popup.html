<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>ReadMeter</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ReadMeter</h1>
      <button id="settingsToggle" class="icon-btn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6.5 1L6.9 2.7C6.3 2.9 5.8 3.3 5.3 3.7L3.7 3.1L2.2 5.7L3.5 6.8C3.5 7.1 3.4 7.4 3.4 7.7C3.4 8 3.5 8.3 3.5 8.6L2.2 9.7L3.7 12.3L5.3 11.7C5.8 12.1 6.3 12.5 6.9 12.7L7.3 14.4H10.3L10.7 12.7C11.3 12.5 11.8 12.1 12.3 11.7L13.9 12.3L15.4 9.7L14.1 8.6C14.1 8.3 14.2 8 14.2 7.7C14.2 7.4 14.1 7.1 14.1 6.8L15.4 5.7L13.9 3.1L12.3 3.7C11.8 3.3 11.3 2.9 10.7 2.7L10.3 1H7.3L6.5 1ZM8.8 5.2C10.2 5.2 11.3 6.3 11.3 7.7C11.3 9.1 10.2 10.2 8.8 10.2C7.4 10.2 6.3 9.1 6.3 7.7C6.3 6.3 7.4 5.2 8.8 5.2Z" stroke="currentColor" stroke-width="1.2" fill="none"/>
        </svg>
      </button>
    </div>

    <!-- Current Article Info -->
    <div id="articleInfo" class="section">
      <div id="articleDetected" class="article-status">
        <div class="article-icon">&#128214;</div>
        <div class="article-details">
          <div id="articleReadTime" class="article-time">--</div>
          <div id="articleWords" class="article-words">--</div>
        </div>
      </div>
      <div id="noArticle" class="no-article" style="display:none;">
        <div class="no-article-icon">&#128196;</div>
        <div class="no-article-text">No article detected on this page</div>
      </div>
    </div>

    <!-- Settings Panel -->
    <div id="settingsPanel" class="section settings-panel" style="display:none;">
      <div class="setting-group">
        <label class="setting-label">
          <span>Extension Enabled</span>
          <label class="toggle">
            <input type="checkbox" id="enabledToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <span>Show Read Time Badge</span>
          <label class="toggle">
            <input type="checkbox" id="badgeToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <span>Show Progress Bar</span>
          <label class="toggle">
            <input type="checkbox" id="progressToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <span>Bar Color</span>
          <div class="color-picker-wrapper">
            <input type="color" id="barColor" value="#4CAF50" class="color-picker">
            <span id="colorPreview" class="color-preview" style="background:#4CAF50;"></span>
          </div>
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <span>Reading Speed</span>
        </label>
        <div class="speed-control">
          <input type="range" id="speedSlider" min="100" max="400" value="238" step="1">
          <span id="speedValue" class="speed-value">238 WPM</span>
        </div>
      </div>
    </div>

    <!-- Today's Stats -->
    <div class="section stats-section">
      <div class="stats-title">Today</div>
      <div class="stats-row">
        <div class="stat">
          <div id="statArticles" class="stat-value">0</div>
          <div class="stat-label">articles</div>
        </div>
        <div class="stat">
          <div id="statTime" class="stat-value">0</div>
          <div class="stat-label">min read</div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
